# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgaudit-forwarder
  # Set the namespace at install time
  # namespace: <your-namespace>

---
# ── Role (namespace-scoped) ──────────────────────────────────────────────────────────────
# Scope: this deployment monitors pods only in its own namespace, so
# a namespace-scoped Role + RoleBinding is sufficient and more secure than
# a ClusterRole/ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgaudit-forwarder
  # namespace: <your-namespace>
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]

---
# ── RoleBinding ──────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgaudit-forwarder
  # namespace: <your-namespace>
subjects:
  - kind: ServiceAccount
    name: pgaudit-forwarder
    # namespace: <your-namespace>
roleRef:
  kind: Role
  name: pgaudit-forwarder
  apiGroup: rbac.authorization.k8s.io
