# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgaudit-forwarder
  namespace: pgaudit-forwarder
  labels:
    app.kubernetes.io/name: pgaudit-forwarder

---
# ── Role – read pods + stream pod logs within the forwarder namespace ──────
# Scope: this deployment monitors pods only in its own namespace, so
# a namespace-scoped Role + RoleBinding is sufficient and more secure than
# a ClusterRole/ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgaudit-forwarder
  namespace: pgaudit-forwarder
  labels:
    app.kubernetes.io/name: pgaudit-forwarder
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]

---
# ── RoleBinding ──────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgaudit-forwarder
  namespace: pgaudit-forwarder
  labels:
    app.kubernetes.io/name: pgaudit-forwarder
subjects:
  - kind: ServiceAccount
    name: pgaudit-forwarder
    namespace: pgaudit-forwarder
roleRef:
  kind: Role
  name: pgaudit-forwarder
  apiGroup: rbac.authorization.k8s.io
