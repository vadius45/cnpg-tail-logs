# /etc/rsyslog.d/50-pgaudit-dsf.conf
#
# Reads pgaudit audit files written by the tailer and forwards them to the
# Thales DSF Agentless Gateway using the syslog protocol (RFC 5424 / TCP).
#
# Thales DSF onboarding reference:
#   https://docs-cybersec.thalesgroup.com/bundle/
#   onboarding-databases-to-sonar-reference-guide/page/
#   PostgreSQL-Onboarding-Steps_48368185.html
#
# The DSF Agentless Gateway expects:
#   - Syslog over TCP (port 514 by default, or the port you configured)
#   - Facility: local0  (adjust to match your DSF policy)
#   - Severity:  info
#   - Program name: "pgaudit" (used by DSF to identify the data source)
# ─────────────────────────────────────────────────────────────────────────────

###############################################################################
# 1. Modules
###############################################################################
module(load="imfile"   Mode="inotify")   # tail files
module(load="omfwd")                      # forward over network

###############################################################################
# 2. Templates
###############################################################################

# RFC 5424 template – DSF parser expects this format.
# %syslogfacility-text% and %syslogseverity-text% are resolved at runtime.
template(name="DSFSyslogFmt" type="string"
  string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% pgaudit - - - %msg%\n"
)

# Optional: local file template for debugging / audit trail
template(name="LocalAuditFmt" type="string"
  string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% pgaudit: %msg%\n"
)

###############################################################################
# 3. Input – tail all pgaudit daily log files
###############################################################################
# The tailer writes files like:
#   /audit/pgaudit/<pod-name>_YYYY-MM-DD.log
# imfile wildcards pick up every pod's file automatically.

input(
  type           = "imfile"
  File           = "/audit/pgaudit/*.log"
  Tag            = "pgaudit"
  Facility       = "local0"
  Severity       = "info"
  PersistStateInterval = "10"         # flush position every 10 lines
  FreshStartTail = "off"              # replay from last known position on restart
  reopenOnTruncate = "on"
)

###############################################################################
# 4. Ruleset – forward pgaudit events to the DSF Agentless Gateway
###############################################################################

# ── DSF Gateway connection parameters ────────────────────────────────────────
# Set DSF_GATEWAY_HOST and DSF_GATEWAY_PORT as environment variables, or
# replace the placeholders below with literal values.
#
# Environment variable substitution in rsyslog requires the
# rsyslog-mmfields / rsyslog-mmnormalize packages; for plain substitution
# we use a global() statement fed from the container's env via entrypoint.sh.
# The entrypoint patches this file at startup with the real values.

# Placeholder tokens replaced by entrypoint.sh at startup:
#   DSF_GATEWAY_HOST  →  e.g. 10.0.0.50
#   DSF_GATEWAY_PORT  →  e.g. 514
#   DSF_PROTOCOL      →  tcp  or  udp

if $syslogtag == "pgaudit" then {

  # Forward to DSF Agentless Gateway
  action(
    type        = "omfwd"
    Target      = "__DSF_GATEWAY_HOST__"
    Port        = "__DSF_GATEWAY_PORT__"
    Protocol    = "__DSF_PROTOCOL__"
    Template    = "DSFSyslogFmt"
    # TCP-specific reliability options (ignored for UDP)
    TCP_Framing = "octet-counted"
    KeepAlive   = "on"
    # Queue for resilience during gateway unavailability
    queue.type  = "LinkedList"
    queue.size  = "10000"
    queue.filename       = "/var/spool/rsyslog/pgaudit-fwd"
    queue.saveOnShutdown = "on"
    action.resumeRetryCount = "-1"    # retry forever
    action.resumeInterval   = "30"
  )

  # Also write locally for audit trail (optional – remove if not needed)
  action(
    type     = "omfile"
    File     = "/audit/pgaudit/forwarded.log"
    Template = "LocalAuditFmt"
  )

  stop   # do not pass pgaudit messages to the default syslog output
}
