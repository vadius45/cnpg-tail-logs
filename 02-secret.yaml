# ─────────────────────────────────────────────────────────────────────────────
# DSF Agentless Gateway connection details
#
# !! Edit the values below before applying !!
#
# Values must be base64-encoded.  Quick encoding:
#   echo -n "10.0.0.50" | base64
#
# Or use kubectl:
#   kubectl create secret generic pgaudit-dsf-gateway \
#     --namespace pgaudit-forwarder \
#     --from-literal=DSF_GATEWAY_HOST=10.0.0.50 \
#     --from-literal=DSF_GATEWAY_PORT=514 \
#     --from-literal=DSF_PROTOCOL=tcp
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pgaudit-dsf-gateway
  # namespace: <your-namespace>
  # labels:
  #   app.kubernetes.io/name: pgaudit-forwarder
type: Opaque
stringData:
  # ▼ Replace with your actual DSF Agentless Gateway address
  DSF_GATEWAY_HOST: "REPLACE_WITH_DSF_GATEWAY_IP_OR_HOSTNAME"
  # ▼ Replace with the syslog port configured in DSF (default 514)
  DSF_GATEWAY_PORT: "514"
  # ▼ tcp (recommended) or udp
  DSF_PROTOCOL: "tcp"
